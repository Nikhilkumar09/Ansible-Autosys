    - name: Fetch local ip address
      shell: curl -s https://checkip.amazonaws.com
      register: local_ip

    - name: Creating a security group for ports 22, 80, and 443.
      amazon.aws.ec2_security_group:
        name: SG-Appdb
        description: Creating a security group for ports 22, 80, and 443.
        vpc_id: vpc-09d27351b06a2825f
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: "{{ local_ip.stdout }}/32"

          - proto: tcp
            ports:
              - 80
              - 443
            cidr_ip: 0.0.0.0/0

    - name: start an linux instance with a public IP address
      amazon.aws.ec2_instance:
        name: "Appdb-Server"
        key_name: "target1"
        vpc_subnet_id: subnet-023a0137f31f46138
        instance_type: t3.micro
        security_group: SG-Appdb
        network_interfaces:
          - assign_public_ip: true
        image_id: ami-087d8c81764fb7292
        tags:
          Environment: Testing 
          Name: Appdb-Server
      
       
    - name: Fetch updated EC2 instance details
      amazon.aws.ec2_instance_info:
        filters:
          instance-state-name: running
          tag:Name: Appdb-Server
      register: ec2
      until: ec2.instances | length > 0 and ec2.instances[0].public_ip_address is defined
      retries: 20
      delay: 5

    - name: Checks 22 (SSH)
      wait_for: 
        host: "{{ ec2.instances[0].public_ip_address }}"
        port: 22
        timeout: 5
      register: port_status
      until: port_status is succeeded      
      retries: 10
      delay: 5


    - name: Add host to web servers (Dynamic inventory file)
      ansible.builtin.add_host:
        name: "{{ ec2.instances[0].public_ip_address }}"
        private_ip: "{{ ec2.instances[0].private_ip_address }}"
        groups: TST_Appdb-Server
        ansible_connection: ssh
        ansible_port: 22
        ansible_user: ec2-user
        ansible_ssh_private_key_file: /home/vkumani/Downloads/Ansible/target1.pem

